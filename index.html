<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>bGrey</title>
  <style>
    body {
      background-color: #ffffff;
      color: #37352f;
      font-family: sans-serif;
    }

    h1, h2 {
      color: #000000;
    }

    a {
      color: #2b6cb0;
    }

    .container {
      max-width: 300px;
      margin: 0 auto;
    }
    
    .link-row {
      display: flex;
      gap: 24px;
    }

    .link-card {
      background-color: #f7f6f3;
      border-radius: 8px;
      padding: 16px;
    }
    
  </style>
</head>
<body>

<div class="container">
  
  <h1>bGrey's Dashboard</h1>
    
<div class="link-row">
  
  <div class="link-card">
    <!-- 링크 구분 1: 코딩 -->
    <h2>Dev</h2>
    <a href="https://cs50.harvard.edu/x">CS50x</a><br>
    <a href="https://github.com/bluishGrey">GitHub</a>
  </div>

  <div class="link-card">
    <!-- 링크 구분 2: 자주 방문 -->
    <h2>Favs</h2>
    <a href="https://youtube.com">YouTube</a>
  </div>

  <div class="link-card">
    <!-- 링크 구분 3: 확장 프로그램 -->
    <h2>Add-ons</h2>
    <a href="https://chromewebstore.google.com/detail/adblock-for-youtube/jpefmbpcbebpjpmelobfakahfdcgcmkl">YT Adblock</a><br>
    <a href="https://chromewebstore.google.com/detail/youtube-nonstop/nlkaejimjacpillmajjnopmpbkbnocid">YT NonStop</a>
  </div>
</div>
</div>
  
</body>
</html>
